events {
    worker_connections 1024;
}

http {
    upstream fleet_api {
        server api:8000;
    }

    server {
        listen 80;
        server_name _;

        # Long timeouts for LLM pipeline (can take 30-120s)
        proxy_connect_timeout 10s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;

        # WebSocket endpoint — must come before the catch-all
        location /ws {
            proxy_pass http://fleet_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_read_timeout 86400s;   # keep WS connections alive
        }

        # Everything else
        location / {
            proxy_pass http://fleet_api;
            proxy_http_version 1.1;
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
            # Allow large request bodies (manual message injection)
            client_max_body_size 10m;
        }
    }
}
